<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cozy Corner | Product Catalog</title>

  <!-- Google Fonts: Playfair Display (Headings) & Plus Jakarta Sans (Body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,400&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    /* Cozy Color Palette */
    :root {
      --bg-color: #faf7f2;          /* Soft Cream */
      --card-bg: #ffffff;           /* Crisp White */
      --text-main: #3a332c;         /* Warm Dark Espresso */
      --text-muted: #80756b;        /* Soft Taupe */
      --accent-color: #c87d55;      /* Terracotta Warmth */
      --accent-hover: #b36b44;      /* Deep Terracotta */
      --border-color: #eee7dd;      /* Gentle Beige Line */
      --shadow-sm: 0 4px 12px rgba(58, 51, 44, 0.05);
      --shadow-hover: 0 10px 24px rgba(58, 51, 44, 0.09);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', sans-serif;
      line-height: 1.6;
      padding: 20px;
      min-height: 100vh;
    }

    /* Container */
    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px 10px;
    }

    /* Header Styling */
    header {
      text-align: center;
      margin-bottom: 40px;
    }

    header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2.5rem;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 8px;
    }

    header p {
      color: var(--text-muted);
      font-size: 1.05rem;
      font-style: italic;
      font-family: 'Playfair Display', serif;
    }

    /* Catalog Grid Layout */
    .catalog-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 30px;
    }

    /* Product Card Styling */
    .product-card {
      background: var(--card-bg);
      border-radius: 16px;
      border: 1px solid var(--border-color);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      display: flex;
      flex-direction: column;
    }

    .product-card:hover {
      transform: translateY(-5px);
      box-shadow: var(--shadow-hover);
    }

    .card-image-wrapper {
      width: 100%;
      height: 240px;
      background-color: #f3ede4;
      overflow: hidden;
      position: relative;
    }

    .card-image-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s ease;
    }

    .product-card:hover .card-image-wrapper img {
      transform: scale(1.04);
    }

    .card-body {
      padding: 20px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .card-category {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: var(--accent-color);
      font-weight: 600;
      margin-bottom: 6px;
    }

    .card-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.35rem;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 8px;
      line-height: 1.3;
    }

    .card-description {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 16px;
      flex-grow: 1;
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 12px;
      border-top: 1px solid var(--border-color);
    }

    .card-price {
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--text-main);
    }

    /* Share Button */
    .share-btn {
      background-color: transparent;
      border: 1px solid var(--accent-color);
      color: var(--accent-color);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.82rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .share-btn:hover {
      background-color: var(--accent-color);
      color: #ffffff;
    }

    /* Loading / Error States */
    .status-msg {
      text-align: center;
      grid-column: 1 / -1;
      padding: 60px 20px;
      color: var(--text-muted);
      font-family: 'Playfair Display', serif;
      font-size: 1.2rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Cozy Corner</h1>
      <p>Handcrafted items made with love and warmth</p>
    </header>

    <main>
      <div id="catalog-grid" class="catalog-grid">
        <div class="status-msg">Gathering catalog items...</div>
      </div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
