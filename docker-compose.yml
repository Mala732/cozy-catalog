services:

  db:
    image: postgres:15-alpine
    container_name: deploylab_db
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10


  backend:
    build: ./backend
    container_name: deploylab_backend
    restart: unless-stopped

    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      DEPLOY_VERSION: ${DEPLOY_VERSION:-local}
      DEPLOY_ENVIRONMENT: ${DEPLOY_ENVIRONMENT:-local}
      DEPLOY_PLATFORM: ${DEPLOY_PLATFORM:-Docker}

    depends_on:
      db:
        condition: service_healthy


  frontend:
    build: ./frontend
    container_name: deploylab_frontend
    restart: unless-stopped

    ports:
      - "8080:80"

    depends_on:
      - backend


volumes:
  postgres_data: