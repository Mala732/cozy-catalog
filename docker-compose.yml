services:
  # 1. PostgreSQL Database Server
  db:
    image: postgres:15-alpine
    container_name: cozy_db
    restart: always
    environment:
      POSTGRES_USER: catalog_user
      POSTGRES_PASSWORD: catalog_password
      POSTGRES_DB: catalog_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

# 2. Python FastAPI Backend API
  backend:
    build: ./backend
    container_name: cozy_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg2://catalog_user:catalog_password@db:5432/catalog_db
    depends_on:
      - db

# 3. Static Web Frontend
  frontend:
    build: ./frontend
    container_name: cozy_frontend
    restart: always
    ports:
      - "8081:80"  # Changed from 8080:80 to 8081:80
    depends_on:
      - backend

volumes:
  postgres_data: